[project]
name = "support-bot"
version = "0.1.0"
description = "Servicio de soporte con IA (RAG) multi-app, con escalado a humanos."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pgvector>=0.4",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.alembic]
script_location = "migrations"
prepend_sys_path = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
